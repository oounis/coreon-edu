# ════════════════════════════════════════════════════════════════════════════
# LA CHAÎNE DE QUALITÉ — rien ne part en ligne sans avoir été prouvé.
#
# AVANT (jusqu'au 2026-07-15) : ce fichier construisait et DÉPLOYAIT. Aucun test
# ne s'exécutait. Un test cassé ne bloquait rien : la seule chose qui protégeait
# la production était qu'un humain pense à lancer `npm test` — donc rien.
#
# MAINTENANT, trois étages, et chacun BLOQUE le suivant :
#   1. qualite  — le cœur métier (tests d'exécution) + le lint + l'audit des
#                 dépendances. Rapide : il échoue en moins d'une minute.
#   2. build    — le bundle. Puis les PARCOURS pilotés au navigateur (e2e/) sur
#                 CE bundle précis : parcours public, demandes, arabe, et le
#                 SMOKE (60 pages × 5 rôles). C'est là qu'on a attrapé l'écran
#                 blanc de la présence.
#   3. deploy   — seulement si tout ce qui précède est vert.
#
# Puis, APRÈS la mise en ligne : `smoke-prod` interroge le site RÉEL. Un
# déploiement vert dont le site répond 404 n'est pas un déploiement réussi.
# ════════════════════════════════════════════════════════════════════════════
name: Qualité, build & déploiement — Coreon Edu
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
# Le groupe était `pages`, une constante : TOUTES les exécutions partageaient
# donc le même verrou, et `cancel-in-progress` faisait s'annuler entre elles
# des vérifications de PR sans aucun rapport. Preuve au 2026-08-17 : quatre
# PR Dependabot (brace-expansion, nanoid, js-yaml, undici) sont restées en
# « cancelled », leur CI n'ayant jamais pu finir — impossible de savoir si
# elles étaient sûres à fusionner. Le groupe inclut désormais la référence,
# comme le fait déjà correctement envs.yml juste à côté.
concurrency: { group: "deploy-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

jobs:
  # ── 1. LE CŒUR : les règles du métier, testées par exécution ───────────────
  qualite:
    name: Tests unitaires & intégration (cœur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Tests d'exécution du cœur
        working-directory: core
        run: npm test
      - name: Tests du serveur (auth, ACL, verrou de révision)
        run: node --test server/test/
      - name: Lint (oxlint — bloque sur erreur, pas sur avertissement)
        working-directory: app
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx oxlint
      - name: Couverture des traductions (outil libre, docs/quality/i18n-audit.py)
        run: |
          python3 docs/quality/i18n-audit.py
          # La barrière monte à mesure qu'on traduit : jamais en arrière.
          # 2026-07-29 : EN et AR atteignent 100 % (823/823). La barrière se
          # cale sur le SEUIL D'ACCEPTATION CLIENT de la norme (95 %) — assez
          # haut pour interdire tout retour en arrière, assez souple pour qu'un
          # correctif urgent qui ajoute une phrase ne bloque pas la livraison.
          python3 docs/quality/i18n-audit.py --gate 95
      - name: Français JAMAIS câblé — l'angle mort de la couverture
        # 2026-07-30 : la couverture répond « parmi les chaînes câblées, combien
        # sont traduites ? ». Une page dont le texte ne passe jamais par t() ne
        # déclare aucune clé, donc n'en manque aucune : elle est INVISIBLE. Le
        # 2026-07-29 l'outil annonçait 0 phrase en dur ; en élargissant la
        # définition (mots sans accent, clés d'objet) il en restait 313 — dont
        # « Annuler », « Enregistrer », « Fermer », déjà traduits mais jamais
        # demandés. Le plafond ci-dessous ne remonte jamais.
        #
        # LES 8 QUI RESTENT SONT ASSUMÉES, et ce ne sont pas des libellés :
        #   · valeurs par défaut de formulaire / données (gender « Garçon »,
        #     relation « Père », allergies « Aucune » — sentinelle relue par le
        #     code, jamais affichée telle quelle) ;
        #   · défauts de démonstration des modules ÉTEINTS (devoirs, examens) ;
        #   · une table dont la LECTURE est déjà traduite, que l'outil ne peut
        #     pas relier à sa définition (CommandPalette).
        run: python3 docs/quality/i18n-raw.py --gate 8
      - name: Repère de dates — le français ne revient pas en dur
        # 2026-07-29 : la couverture ne voit pas les dates (ce ne sont pas des
        # clés t()). Le produit affichait 62 % d'anglais et 100 % de dates
        # françaises. Un seul endroit décide : app/src/datefns.js + dateLocale().
        run: python3 docs/quality/i18n-audit.py --dates
      - name: Audit des dépendances — CRITIQUE bloque, HAUTE avertit
        working-directory: app
        run: |
          npm audit --omit=dev --audit-level=critical
          npm audit --omit=dev --audit-level=high || echo "::warning::vulnérabilités HAUTES présentes — voir docs/quality/security-checklist.md"

  # ── 2. LE BUNDLE, puis les parcours pilotés au navigateur SUR ce bundle ────
  build:
    name: Build + parcours navigateur (e2e & smoke)
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Installer & construire
        working-directory: app
        env: { VITE_MAIL_TOKEN: "${{ secrets.VITE_MAIL_TOKEN }}" }
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - name: Installer les dépendances du mobile (pour le smoke mobile)
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Installer le harnais et son navigateur
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright@1.61 install --with-deps chromium-headless-shell
      - name: Parcours (public · demandes · arabe · smoke · qualité a11y+PDF · perf · mobile)
        working-directory: e2e
        run: npm run all
      - uses: actions/configure-pages@v6
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }

  # ── 3. LA MISE EN LIGNE — seulement si tout ce qui précède est vert ────────
  deploy:
    name: Déploiement
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # ── 4. APRÈS LA MISE EN LIGNE : le site réel répond-il ? ───────────────────
  # « Déployé » n'est pas « en ligne ». On vérifie l'adresse de production.
  smoke-prod:
    name: Smoke de production (le site réel)
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Le site répond, et sert bien l'application
        run: |
          set -e
          URL="https://edu.kogiagroup.com/"
          # GitHub Pages met parfois un moment à propager un nouveau déploiement
          # sur le CDN : on RÉESSAIE jusqu'à obtenir 200 + la coquille de l'app,
          # plutôt qu'un unique appel qui attrape la fenêtre de propagation et
          # rougit un déploiement pourtant sain (bug observé le 2026-07-19).
          ok=0
          for i in $(seq 1 20); do
            code=$(curl -s -o page.html -w "%{http_code}" "$URL" || echo 000)
            if [ "$code" = "200" ] && grep -q '<div id="root">' page.html; then
              echo "Page servie (200, coquille présente) à l'essai $i."
              ok=1; break
            fi
            echo "Essai $i : HTTP $code — nouvelle tentative dans 15 s…"
            sleep 15
          done
          test "$ok" = "1" || { echo "::error::Le site n'a pas répondu 200 avec la coquille après ~5 min."; exit 1; }
          # PREUVE que le bundle servi est bien le nôtre.
          #
          # ⚠️ LEÇON DU 2026-07-29. Cette étape a fait ROUGIR le chaînon `main`
          # de v1.5.0 alors que le déploiement était SAIN : depuis que chaque
          # langue est un morceau chargé à la demande, `i18n.ar-*.js` n'est plus
          # référencé par index.html — il n'est nommé QUE DANS le morceau de
          # mécanique qui l'importe dynamiquement. Chercher l'arabe dans les
          # seuls bundles cités par la page revenait à le chercher là où il ne
          # peut plus être. On suit donc les morceaux SUR DEUX NIVEAUX : ceux
          # que la page cite, puis ceux que ces morceaux-là citent à leur tour.
          assets=$(grep -oE 'assets/[^"]+\.js' page.html | sort -u)
          test -n "$assets"
          mkdir -p .chunks
          fetch_all() {
            for a in $1; do
              n=$(echo "$a" | tr '/' '_')
              [ -f ".chunks/$n" ] || curl -s -o ".chunks/$n" "$URL$a" || true
            done
          }
          fetch_all "$assets"
          # 2ᵉ niveau : les imports dynamiques nommés à l'intérieur des morceaux.
          # Rolldown les écrit RELATIFS — « ./i18n.ar-CTAhwYjB.js », sans le
          # préfixe « assets/ » : on les capte tels quels et on les y raccroche.
          nested=$(cat .chunks/* 2>/dev/null \
            | grep -oE '\./[A-Za-z0-9._-]+\.js' | sed 's#^\./#assets/#' | sort -u)
          fetch_all "$nested"
          found_core=0; found_ar=0; found_en=0
          for f in .chunks/*; do
            grep -q "coreon_db" "$f" && found_core=1
            grep -q "لوحة المتابعة" "$f" && found_ar=1
            grep -q "Report cards & promotion" "$f" && found_en=1
          done
          test "$found_core" = "1" || { echo "::error::cœur (coreon_db) absent des bundles servis"; exit 1; }
          test "$found_ar"   = "1" || { echo "::error::arabe (لوحة المتابعة) absent des bundles servis"; exit 1; }
          test "$found_en"   = "1" || { echo "::error::anglais (dictionnaire EN) absent des bundles servis"; exit 1; }
          echo "✅ Production saine : page, cœur, arabe et anglais servis."

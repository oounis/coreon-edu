# ════════════════════════════════════════════════════════════════════════════
# LES ENVIRONNEMENTS — dev & int (CR-031, déclenché par la « version finale »).
#
# RÈGLE DE FLUX — révisée le 2026-08-20, lisez-la avant d'ouvrir une PR.
#
# L'ancienne règle écrite ici était « dev → int → main, jamais de saut ». Elle
# n'a jamais été suivie : au 2026-08-20, `dev` et `int` étaient 19 commits
# DERRIÈRE `main` et 0 devant — mortes depuis le 2026-08-06, pendant que tout
# passait directement par `main`. Une règle que personne n'applique est pire
# qu'une règle absente : la PR #24 (correctifs de sécurité) a été ouverte
# contre `dev` en croyant bien faire, et y est restée bloquée à l'écart de la
# production. C'est le contraire du but recherché.
#
# La règle réelle, désormais assumée et écrite :
#
#   · main → edu.kogiagroup.com      LA PRODUCTION, et la CIBLE DES PR.
#            Toute PR se fait contre `main`. Elle est protégée par deploy.yml,
#            qui fait tourner la chaîne COMPLÈTE sur chaque PR — rien n'entre
#            sans être prouvé. C'est cette chaîne qui protège la prod, pas un
#            enchaînement de branches que personne ne promeut.
#
#   · dev  → dev.edu.kogiagroup.com  APERÇU À LA DEMANDE, chaîne RAPIDE
#            (tests cœur + serveur, build, smoke navigateur).
#   · int  → int.edu.kogiagroup.com  APERÇU À LA DEMANDE, chaîne COMPLÈTE
#            (la même que la production, tous les parcours).
#
# `dev` et `int` ne sont PAS des étapes obligatoires. Ce sont deux vitrines
# qu'on alimente quand on veut voir tourner quelque chose sur une vraie URL
# avant de le proposer — une maquette à montrer, un doute à lever sur mobile,
# une migration à observer. On y pousse à la demande :
#
#     git push origin main:dev      # ou  ma-branche:dev
#     git push origin main:int
#
# Elles sont réalignées sur `main` après chaque fusion pour qu'elles ne
# redeviennent pas les branches mortes du 2026-08-06.
#
# Le déploiement Cloudflare passe par wrangler avec les secrets
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (réglés le 2026-07-25).
# ════════════════════════════════════════════════════════════════════════════
name: Environnements — dev & int
on:
  push: { branches: [dev, int] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "env-${{ github.ref_name }}", cancel-in-progress: true }

jobs:
  qualite:
    name: Tests unitaires & intégration (cœur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Tests d'exécution du cœur
        working-directory: core
        run: npm test
      - name: Tests du serveur (auth, ACL, verrou de révision)
        run: node --test server/test/

  deploy:
    name: "Build, parcours & déploiement (${{ github.ref_name }})"
    needs: qualite
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: "https://${{ github.ref_name }}.edu.kogiagroup.com"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Installer & construire
        working-directory: app
        env:
          VITE_MAIL_TOKEN: "${{ secrets.VITE_MAIL_TOKEN }}"
          VITE_SENTRY_DSN: "${{ secrets.VITE_SENTRY_DSN }}"
          VITE_RELEASE: "${{ github.sha }}"
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - name: Installer le harnais et son navigateur
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright@1.61 install --with-deps chromium-headless-shell
      - name: "Parcours dev : le smoke (60 pages × 5 rôles) + le parcours public"
        if: github.ref_name == 'dev'
        working-directory: e2e
        run: |
          node parcours.public.mjs
          node parcours.smoke.mjs
      - name: Installer les dépendances du mobile (pour le smoke mobile)
        if: github.ref_name == 'int'
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: "Parcours int : la chaîne COMPLÈTE (la même que la production)"
        if: github.ref_name == 'int'
        working-directory: e2e
        run: npm run all
      - name: Déployer sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=coreon-edu-${{ github.ref_name }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
      - name: "Smoke d'environnement : le sous-domaine sert bien l'application"
        # AUDIT 2026-08-02 : le nom de branche était interpolé DIRECTEMENT dans le
        # script (`${{ github.ref_name }}` dans un `run:`) — une branche nommée avec
        # des métacaractères shell exécutait son propre code sur le runner. Il passe
        # désormais par l'environnement, où le shell ne le réinterprète pas.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          URL="https://${REF_NAME}.edu.kogiagroup.com/"
          ok=0
          for i in $(seq 1 20); do
            code=$(curl -s -o page.html -w "%{http_code}" "$URL" || echo 000)
            if [ "$code" = "200" ] && grep -q '<div id="root">' page.html; then ok=1; break; fi
            echo "Essai $i : HTTP $code — nouvelle tentative dans 10 s…"; sleep 10
          done
          test "$ok" = "1" || { echo "::error::$URL ne sert pas l'application."; exit 1; }
          echo "✅ $URL sert la coquille de l'application."

# Mises à jour de dépendances — gratuit, intégré à GitHub.
# Groupées et mensuelles : on veut être à jour, pas noyés sous les PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      tout: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      # `exclude-patterns` et pas seulement `ignore` : le 2026-08-14 la PR
      # groupée #29 a remonté expo 54 → 57 alors que `ignore` listait déjà
      # expo. La liste `ignore` ne filtre que les PR DÉDIÉES — elle ne retire
      # PAS un paquet d'un groupe `patterns: ['*']`. Il faut les deux.
      tout:
        patterns: ['*']
        exclude-patterns: ['expo', 'react', 'react-native']
    # ⚠️ Le 2026-07-11, le SDK a été RÉTROGRADÉ 57 → 54 délibérément : l'App
    # Store ne propose qu'Expo Go SDK 54, et en 57 l'application était
    # INTESTABLE sur l'iPhone d'Othman. Le 2026-08-09, une PR groupée l'a
    # silencieusement remonté en 57 et a annulé cette décision — personne ne
    # l'a vu pendant deux jours. Ces trois paquets sont contraints par une
    # plateforme externe, pas par notre code : ils se changent à la main, avec
    # une raison écrite.
    ignore:
      - dependency-name: expo
      - dependency-name: react-native
      - dependency-name: react
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
